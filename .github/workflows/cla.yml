name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/synesis-lang/synesis/blob/main/CLA.md"
          branch: "main"
          allowlist: dependabot[bot],dependabot-preview[bot]

          remote-organization-name: "synesis-lang"
          remote-repository-name: "cla-signatures"

          custom-notsigned-prcomment: |
            Thank you for your contribution to Synesis! Before this pull request can be
            merged, please read and sign the [Synesis Individual Contributor License
            Agreement (CLA)](https://github.com/synesis-lang/synesis/blob/main/CLA.md).

            If you are contributing on behalf of an employer, see the "Contributing on
            behalf of an employer" section at the end of the CLA — a Corporate CLA may
            be required in addition to your signature.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. ✅"
