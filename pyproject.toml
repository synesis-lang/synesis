[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synesis"
version = "0.7.0"
description = "The confluence of information into intelligence - A DSL compiler that transforms qualitative research annotations into canonical knowledge structures"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "De Britto, Christian Maciel", email = "chriseana@gmail.com"}
]
maintainers = [
    {name = "Synesis Language Organization", email = "chriseana@gmail.com"}
]
keywords = [
    "qualitative-research",
    "compiler",
    "dsl",
    "domain-specific-language",
    "bibliometrics",
    "annotation",
    "research-tools",
    "bibtex",
    "ontology"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Typing :: Typed"
]
dependencies = [
    "lark >= 1.1",
    "bibtexparser >= 1.4",
    "regex >= 2023.0.0",
    "click >= 8.0",
    "openpyxl >= 3.0",
]

[project.optional-dependencies]
dev = [
    "pytest >= 7.0",
    "pytest-cov >= 4.0",
    "build >= 0.10",
    "twine >= 4.0",
    "ruff == 0.15.17",
    "mypy == 1.16.0",
]

[project.urls]
Homepage = "https://synesis-lang.github.io/synesis-docs"
Documentation = "https://synesis-lang.github.io/synesis-docs"
Repository = "https://github.com/synesis-lang/synesis"
Issues = "https://github.com/synesis-lang/synesis/issues"
Changelog = "https://github.com/synesis-lang/synesis/blob/main/CHANGELOG.md"

[project.scripts]
synesis = "synesis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synesis*"]
exclude = ["out_dir*", "davi_pesquisa*", "bibliometrics*", "examples*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated by Lark — not hand-maintained, exclude from lint/format.
extend-exclude = ["synesis/grammar/synesis_standalone.py"]

[tool.ruff.lint]
# Lenient baseline: bug-catching rules (F) and import sorting (I) are enforced;
# cosmetic/modernization rules are deferred (tracked, to be tightened incrementally).
select = ["F", "I"]
ignore = ["F541"]  # f-string-missing-placeholders (cosmetic)

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
